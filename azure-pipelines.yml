# CI/CD API — Azure Pipelines (repo en GitHub)
# Trigger: push a main. También se puede ejecutar manualmente.
# Variables: AZURE_WEBAPP_NAME, AZURE_WEBAPP_PUBLISH_PROFILE (secreto)
# Deploy: Zip Deploy a Kudu (compatible con App Service Linux/Windows)

trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: Build and publish
    jobs:
      - job: BuildApi
        displayName: .NET build
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: Setup .NET 10
            inputs:
              packageType: sdk
              version: "10.0.x"

          - bash: |
              set -euo pipefail
              if [[ -f "ArcanoPizza_API/ArcanoPizza_API.csproj" ]]; then
                PROJECT_PATH="ArcanoPizza_API/ArcanoPizza_API.csproj"
              elif [[ -f "ArcanoPizza_API/ArcanoPizza_API/ArcanoPizza_API.csproj" ]]; then
                PROJECT_PATH="ArcanoPizza_API/ArcanoPizza_API/ArcanoPizza_API.csproj"
              elif [[ -f "ArcanoPizza_API.csproj" ]]; then
                PROJECT_PATH="ArcanoPizza_API.csproj"
              else
                echo "No se encontró ArcanoPizza_API.csproj en rutas conocidas." >&2
                ls -la
                exit 1
              fi
              echo "##vso[task.setvariable variable=PROJECT_PATH]$PROJECT_PATH"
              echo "Usando PROJECT_PATH=$PROJECT_PATH"
            displayName: Resolve project path

          - script: dotnet restore "$(PROJECT_PATH)"
            displayName: Restore

          - script: dotnet build "$(PROJECT_PATH)" -c Release --no-restore
            displayName: Build

          - script: dotnet publish "$(PROJECT_PATH)" -c Release -o "$(Build.ArtifactStagingDirectory)/publish" --no-build
            displayName: Publish

          - publish: $(Build.ArtifactStagingDirectory)/publish
            artifact: api-publish
            displayName: Upload artifact

  - stage: Deploy
    displayName: Deploy Web App
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: DeployApi
        displayName: Azure Web App (Zip Deploy)
        steps:
          - download: current
            artifact: api-publish
            displayName: Download artifact

          - bash: |
              set -euo pipefail

              PUBLISH_DIR="$(Pipeline.Workspace)/api-publish"
              ZIP_PATH="$(Agent.TempDirectory)/api-publish.zip"
              PROFILE_PATH="$(Agent.TempDirectory)/publish-profile.xml"

              printf '%s\n' "$AZURE_WEBAPP_PUBLISH_PROFILE" > "$PROFILE_PATH"

              # Preferir el perfil MSDeploy (Web Deploy) del XML.
              MSDEPLOY_LINE="$(grep -o 'publishMethod="MSDeploy"[^/]*' "$PROFILE_PATH" | head -n 1 || true)"
              if [[ -z "$MSDEPLOY_LINE" ]]; then
                MSDEPLOY_LINE="$(cat "$PROFILE_PATH")"
              fi

              USERNAME="$(printf '%s' "$MSDEPLOY_LINE" | grep -oP 'userName="\K[^"]+' | head -n 1 || true)"
              PASSWORD="$(printf '%s' "$MSDEPLOY_LINE" | grep -oP 'userPWD="\K[^"]+' | head -n 1 || true)"
              PUBLISH_URL="$(printf '%s' "$MSDEPLOY_LINE" | grep -oP 'publishUrl="\K[^"]+' | head -n 1 || true)"

              if [[ -z "$USERNAME" || -z "$PASSWORD" ]]; then
                echo "No se pudo leer userName/userPWD del publish profile." >&2
                exit 1
              fi

              if [[ -n "$PUBLISH_URL" ]]; then
                SCM_HOST="${PUBLISH_URL%%:*}"
              else
                SCM_HOST="${AZURE_WEBAPP_NAME}.scm.azurewebsites.net"
              fi

              echo "Empaquetando $(PUBLISH_DIR) → $(ZIP_PATH)"
              (cd "$PUBLISH_DIR" && zip -r "$ZIP_PATH" .)

              echo "Zip Deploy → https://${SCM_HOST}/api/zipdeploy"
              HTTP_CODE="$(curl -sS -o "$(Agent.TempDirectory)/zipdeploy-response.txt" -w "%{http_code}" \
                -X POST \
                -u "${USERNAME}:${PASSWORD}" \
                -H "Content-Type: application/zip" \
                --data-binary @"$ZIP_PATH" \
                "https://${SCM_HOST}/api/zipdeploy")"

              echo "HTTP $HTTP_CODE"
              cat "$(Agent.TempDirectory)/zipdeploy-response.txt" || true
              echo
              if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "202" ]]; then
                echo "Zip Deploy falló con HTTP $HTTP_CODE" >&2
                exit 1
              fi
            displayName: Zip Deploy via Kudu
            env:
              AZURE_WEBAPP_PUBLISH_PROFILE: $(AZURE_WEBAPP_PUBLISH_PROFILE)
              AZURE_WEBAPP_NAME: $(AZURE_WEBAPP_NAME)
